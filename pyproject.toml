[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reloop-ecoroute"
version = "1.0.0"
description = "ReLoop — Evidence-based E-waste & Recycling Pickup Coordinator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ReLoop Team"}
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.2.0",
    "gunicorn>=21.2.0",
    "psycopg[binary]>=3.1.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "ecoroute*"]
namespaces = true

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["ecoroute/backend/tests"]
pythonpath = ["ecoroute/backend"]
