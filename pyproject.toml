[project]
name = "reloop-ecoroute"
version = "0.1.0"
description = "ReLoop E-waste and Recycling Pickup Coordinator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0.0",
  "google-genai>=1.2.0",
]

[tool.vercel]
entrypoint = "ecoroute.backend.main:app"
