services:
  - type: web
    name: reloop-ecoroute
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
